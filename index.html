<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dist/framework.css" />
    <title>Document</title>
  </head>
  <body>
    <div style="display: flex; flex-wrap: wrap; gap: 15px; margin: 25px 0">
      <button class="btn btn--primary">Click me</button>
      <button class="btn btn--danger">Danger</button>
      <button class="btn btn--success">Success</button>
      <button class="btn btn--dark">Dark</button>
      <button class="btn btn--pill btn--primary">Click me</button>
      <button class="btn btn--pill btn--danger">Danger</button>
      <button class="btn btn--pill btn--success">Success</button>
      <button class="btn btn--pill btn--dark">Dark</button>

      <button class="btn btn--primary btn--outline">Click me</button>
      <button class="btn btn--outline btn--danger">Danger</button>
      <button class="btn btn--outline btn--success">Success</button>
      <button class="btn btn--outline btn--dark">Dark</button>

      <p class="text--primary">Hello World</p>
      <p class="text--danger">Hello World</p>
      <p class="text--success">Hello World</p>
      <p class="text--dark">Hello World</p>

      <div class="bg--danger" style="width: 50px; height: 50px;"></div>
      <div class="bg--success" style="width: 50px; height: 50px;"></div>
      <div class="bg--primary" style="width: 50px; height: 50px;"></div>
      <div class="bg--dark" style="width: 50px; height: 50px;"></div>
      <div class="border--primary" style="width: 50px; height: 50px;"></div>
      <div class="border--dark" style="width: 50px; height: 50px;"></div>
      <div class="border--success" style="width: 50px; height: 50px;"></div>
      <div class="border--danger" style="width: 50px; height: 50px;"></div>
    </div>
  </body>
</html>
