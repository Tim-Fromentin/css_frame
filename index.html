<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dist/framework.css" />
    <title>Document</title>
  </head>
  <body>
    <div style="display: flex; flex-wrap: wrap; gap: 15px; margin: 25px 0">
      <button class="btn btn--primary">Click me</button>
      <button class="btn btn--danger">Danger</button>
      <button class="btn btn--success">Success</button>
      <button class="btn btn--dark">Dark</button>
      <button class="btn btn--pill btn--primary">Click me</button>
      <button class="btn btn--pill btn--danger">Danger</button>
      <button class="btn btn--pill btn--success">Success</button>
      <button class="btn btn--pill btn--dark">Dark</button>

      <button class="btn btn--primary btn--outline">Click me</button>
      <button class="btn btn--outline btn--danger">Danger</button>
      <button class="btn btn--outline btn--success">Success</button>
      <button class="btn btn--outline btn--dark">Dark</button>
    </div>

    <div
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin: 15px 0;
        align-items: center;
      "
    >
      <button class="btn btn--primary anim--scale">scale</button>
      <button class="btn btn--primary anim--reduce">reduce</button>
      <button class="btn btn--primary anim--bounce">bounce</button>
      <button style="width: 50px; height: 50px; background: #000;" class="anim--rotate">rotate</button>
      <button class="btn btn--primary anim--bg-success">bg Success</button>
      <button class="btn btn--primary anim--bg-danger">bg danger</button>
      <button class="btn btn--danger anim--bg-primary">bg primary</button>
      <button class="btn btn--primary anim--bg-dark">bg dark</button>

      <button class="anim--color-success">
        color Success
      </button>
      <button class="anim--color-danger">color danger</button>
      <button class="anim--color-primary">color primary</button>
      <button class="anim--color-dark">color dark</button>
      <button class="btn btn--primary anim--pulse">pulse</button>

      <a href="#" class="anim--link-underline">hover me</a>

    </div>
  </body>
</html>
